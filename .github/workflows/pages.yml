name: Build and deploy font-inspector website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out inspector
        uses: actions/checkout@v4
      - name: Check out Marpich site source
        uses: actions/checkout@v4
        with:
          repository: saeideeshghi/marpich-sanat-v4
          ref: b69bdfeeea985721816a09193a4d50a9c1634728
          path: upstream
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Install and build source website
        working-directory: upstream
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          npm ci
          npm run build:pages
      - name: Add automatic font overlay
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/inject-overlay.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/dist/pages
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

